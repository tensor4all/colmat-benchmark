# Chart configuration for scripts/throughput_report.py. Nothing here is a measurement: the operation
# count per family is the algorithmic count used to turn a time into a nominal GFLOP/s figure, and the
# series say which engine row of which recorded run becomes which line. Nominal GFLOP/s is therefore
# comparable across sizes within one family, and not across families.
version: v2
# One page per recorded dataset: the Pages deploy generates one chart set (and one site
# page, scripts/gen_site.py) per (dtype, order) below, in this order -- f64 / F first, the
# column-major default view.
variants:
  - {dtype: f64, order: f}
  - {dtype: f64, order: c}
  - {dtype: c64, order: f}
  - {dtype: c64, order: c}
page:
  title: "Throughput charts - timing-v2 baseline"
  run_labels: ["daily MKL", "daily OpenBLAS", "large-tier MKL", "large-tier OpenBLAS"]
  notes:
    - "Each page is one recorded dataset, one `(dtype, order)`: the vendor LAPACK rows are measured where the harness records them -- both orders for `gemm`, F order only for the decomposition families -- and a dot in a data table means that row was not measured in that arm."
    - "Generated by the Pages deploy (`scripts/gen_site.py`, through the campaign toolkit) from the recorded runs below; no timing is run here."
    - "The `c64` pages are drawn from the recorded `c64` cells of the same runs as the `f64` pages, with a complex element counting four times the real operations."
    - "**Nominal** GFLOP/s: one algorithmic operation count per family, so sizes are comparable within a family and absolute values are not comparable across families. The count is stated under every chart and in each data table."
    - "Error bars are the between-start sample SD of the process medians, not a confidence interval. The `!` cells of the measured pages are included as they were recorded."
    - "`faer-fork`, `faer-upstream` and `lapack-mkl` come from one recorded run and therefore from one process each; `lapack-openblas` comes from the other arm (its own binary), so its absolute level carries the between-arm uncertainty."
    - "Recorded sizes: the daily suite's grid (32-768, no boundary shapes) at 1T/4T/8T; the large-tier run adds the 2^k±1 boundary shapes (255/257/511/513) and 1024/1536 at 4T/8T, in every `(dtype, order)` these pages show. A line stops where a size was not measured - nothing is interpolated."
    - "The 1024 points are a separate recording from the 32-768 points, so they carry their own run-to-run uncertainty on top of the between-start bars. Where the large-tier run is at the same fork revision as the daily run, the code is the same at 1024 (the row-major copy floor, `faer#23`, only changes shapes below 4096 elements)."
series:
  - engine: faer-fork
    label: colmat     # the display name; the engine row stays what the runs record
    run: [0, 2]       # positions 0/2: the daily and the large-tier run of the arm that carries upstream (MKL)
    colour: "#9467bd"
    marker: circle
    width: 1.9        # the fork is the subject of the campaign: solid, thicker, drawn last
    size: 4.2
  - engine: faer-upstream
    label: faer
    run: [0, 2]
    colour: "#1f77b4"
    marker: circle
    dash: "5 3"
    size: 2.2
  - engine: lapack-mkl
    label: MKL
    run: [0, 2]
    colour: "#2ca02c"
    marker: triangle
    size: 3.0
  - engine: lapack-openblas
    label: OpenBLAS
    run: [1, 3]
    colour: "#d62728"
    marker: diamond
    size: 3.0
families:
  gemm:        {coefficient: 2.0,     label: "2n^3"}
  lu:          {coefficient: 0.66667, label: "2n^3/3"}
  full_piv_lu: {coefficient: 0.66667, label: "2n^3/3 (no vendor row: unsupported)"}
  cholesky:    {coefficient: 0.33333, label: "n^3/3"}
  qr_factor:   {coefficient: 1.33333, label: "4n^3/3 (compact factors)"}
  qr:          {coefficient: 2.66667, label: "8n^3/3 (factors and explicit Q)"}
  svd_values:  {coefficient: 4.0,     label: "4n^3 (singular values only)"}
  svd_thin:    {coefficient: 10.0,    label: "~10n^3 (Golub-Kahan, implementation dependent)"}
  eigh:        {coefficient: 2.66667, label: "8n^3/3 (self-adjoint, vectors)"}
