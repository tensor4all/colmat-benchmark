schema_version: 1
id: faer-kernels-ohtaka-large
description: >-
  The ohtaka-cpu large-only suite (colmat-benchmark#97): f64, F order, 4096 and 8192 at 16, 32,
  64 and 128 threads on one ISSP ohtaka F1cpu-type node (128 cores, exclusive). There is no 1T row
  at these sizes and no 16384/32768 tier on this profile; `faer-kernels-ohtaka-small` carries 1T for
  2048. Families: the twelve the landing page compares (colmat-benchmark#129), with 8192x512 and
  512x8192 rectangles and the 4095/4097 block boundary beside the 4096/8192 squares, measured at
  faer's own API against one vendor arm per run, recorded with MKL from the ohtaka `oneapi_mkl/2025.2.0` module (the upstream
  faer row is not measured: the 2-process-set budget needs a 2-row arm). The four-family grid
  (gemm, LU, Cholesky, QR factor) declared before #129 was recorded as 30-minute debug-queue
  (`i8cpu`) runs, one thread budget per run and one LU/Cholesky/QR family (with gemm) per 8192 run,
  so every run is a partial one; see `known_blind_spots`.
# Only paths in the *measured* fork whose change can alter a measured result. The
# harness and the timing protocol live in this repository, not in the fork, so
# they cannot appear here; see docs/results.md for how a harness change is
# recorded. Deliberately not `docs/**` or `tests/**`: an edit there does not make
# a measurement stale.
invalidated_by:
  - faer/src/**
  - faer-traits/src/**
  - faer-macros/src/**
  - Cargo.toml
  - Cargo.lock
stale_after: 20
# Empty until the first (zen5-cpu, faer-kernels) cell exists: `missing` is a
# normal state for a cell with no run, and it becomes an error only for a profile
# listed as required. The first recorded cell moves `zen5-cpu` in here.
# Only the ohtaka-cpu profile (tensor4all/colmat-benchmark#97). Never measured on zen5-cpu or the
# zen2 profiles: these shapes and thread budgets are sized for a 128-core node.
required_profiles: []
optional_profiles:
  - ohtaka-cpu

# The twelve families the landing page compares (`scripts/family_matrix.py::FAMILY_ORDER`), the
# same set the zen5 suites declare minus `eig` and `upgrade_factor`, which the harness does not
# implement (always `skipped`) and the page does not show. Grouped by the shapes a family can take,
# so a population only names families that are defined on its shapes: `square` holds the families
# that are square by definition (`cholesky`, `solve`, `triangular_solve`, `eigh`) and `full_piv_lu`,
# whose vendor route `?getc2` is square only (#133); none of them is put in a rectangular
# population, so no rectangular cell is left for the harness to discover as a skip.
family_groups:
  gemm:
    - gemm
  factor:
    - lu
  square:
    - cholesky
    - solve
    - triangular_solve
    - full_piv_lu
    - eigh
  decompose:
    - qr_factor
    - qr
    - svd_values
    - svd_thin
  householder:
    - householder_apply

# What the workload is, in a form the result page can print.
workloads:
  name: faer dense kernels and decompositions
  description: >-
    Direct calls into one faer revision: square and rectangular dense matrices,
    C (row-major) and F (column-major) order, `f64` and `c64`. A shape is `N` for
    square, `MxN` for rectangular, or `MxKxN` for `gemm`, which is a three-index
    operation and cannot be written as two. Sizes are the matrix dimensions, not
    a memory budget, so a case name says exactly what was factored. `gemm`
    measures `linalg::matmul::matmul` into a caller-prepared destination with
    `Accum::Replace`; there is no operator path, so one shape is one work.
  source: >-
    The fork's own public API (`faer/src/linalg`): `matmul`, the QR factor and
    composite, `upgrade_householder_factor`, the block/sequence Householder
    apply, LU and full-pivot LU, Cholesky, triangular solve, solve, thin SVD,
    singular values and the symmetric/nonsymmetric eigensolvers. Inputs are
    seeded from the case, so `verify` and `run` measure the same matrices and a
    rerun is reproducible.
  known_blind_spots:
    - "NOT L3-LOCAL: on the ohtaka-cpu profile the L3 domains are 4 CPUs each (32 of them), so no thread row above 1T sits in one L3 domain, unlike the evo2 profile's one-domain cells. 16T spans 4 L3 domains (the fewest that give 16 CPUs; NUMA node 0), 32T 8, 64T 16 and 128T 32, each whole, with the recorder pinned outside them for the rows below 128T. Read these cells as N threads over N/4 private 16 MiB caches, not as a shared-L3 measurement; the sets can be checked against the node's cache topology with `python3 scripts/cpu_sets.py check ohtaka-cpu` on a compute node (#143; it was run there and agreed with these sets, but nothing runs it automatically)."
    - "Only the faer entry points are measured. tlinalg's packing, batch loop and lane policy, tenferro's tensor construction and dtype dispatch, and the small-`m` decode-projection shapes are other repositories' rows (tlinalg-benchmark, tenferro-benchmark)."
    - "Vendor C-order cells use CBLAS/LAPACKE row-major entry points. Workspace allocation or layout conversion internal to those APIs remains timed; these are not prepared-column-major or transpose measurements."
    - "`gemm` covers the tall class's two Householder legs (a 16-wide basis and a 240-column target over 4096 rows: the reduction and the write-back) beside a vendor `?gemm` on the same leg. A single leg beside a vendor gemm is a diagnostic reference, not the equivalent implementation of the whole update, and the row is labelled accordingly."
    - "`householder_apply` measures block apply and the one-block sequence form as two distinct rows, labelled with basis width min(m,n) and target width n. QR fixture preparation is outside timing. Independently varied basis/target widths and multi-panel sequences are not covered."
    - "Allocation performed inside the measured call stays inside the clock. The fork's two row splits allocate their partial buffers inside the public call, and the public scratch function does not expose them; the campaign reports that as it is instead of changing faer's API to make the boundary look cleaner."
    - "`cholesky`, `eigh`, `solve` and `triangular_solve` are measured on square shapes only: the matrix they factor or solve with is square by definition (self-adjoint for the first two, a triangular factor for the last). `lu` and `full_piv_lu` are not gated that way -- they take the declared rectangular shapes too, with `min(m, n)` pivots and a trapezoidal `L` or `U`, which is what `dgetrf` does as well -- so a rectangular LU cell is measured in both orders beside its square one."
    - "BLIS, sparse, iterative and GPU arms are later declarations, not machinery built now."
    - "A vendor arm records the library it linked. Only OpenBLAS reports the kernel its runtime dispatched to; MKL names no kernel and no processor count, so its manifest leaves both empty rather than inferring them."
    - "The upstream faer row is not measured on this profile: the 2-process-set budget (`--aa 2`) needs a 2-row arm, so each run measures only the colmat fork and its one vendor arm (MKL for this suite on ohtaka; the small and c64 suites carry the OpenBLAS arm). The upstream faer revision printed in the page header is the pinned baseline of the campaign, not a measured column."
    - "Machine state not shown elsewhere: the ISSP ohtaka compute node exposes no cpufreq interface, so boost and governor are unrecorded; the layout is 2 sockets, 8 NUMA nodes of 16 cores (node k = CPUs 16k..16k+15), SMT off, 16 MiB L3 per 4-core CCX. Timing settings are reps 3, 2 process sets, priming 100 ms, below the 250 ms of the frozen v2 baseline (150 ms was rejected there because one cell read about 3% fast), so single cells may read a few percent fast."
    - "No OpenBLAS arm here and no SMT: this suite is recorded with the MKL arm (oneapi_mkl/2025.2.0 module, MKL 2025.2 with its Intel OpenMP runtime) on one ISSP ohtaka node with SMT off, so its vendor row is not directly comparable with the OpenBLAS rows of the small and c64 suites; at 128T every CPU is measured and no observer CPU exists (the run is recorded with an observer-unavailable caveat that covers the whole run, although the recorder was pinned to CPUs 64-127 for the rows up to 64T)."
    - "Recorded in slices: the grid is covered by 18 partial runs under `data/results/ohtaka-cpu/faer-kernels-ohtaka-large/` (4096 at each thread budget; 8192 per thread budget and per family), each a 30-minute `i8cpu` allocation on its own node of the same type. The published page is one of those runs (the publisher keeps one run per page and marks it partial); the other slices are in the raw data, not on the page. Cells from different slices were timed on different nodes and in different sessions."
    - "Coverage is the declared grid only (see `runs`): the twelve families the landing page compares (gemm, lu, cholesky, solve, qr_factor, qr, eigh, svd_thin, svd_values, full_piv_lu, triangular_solve, householder_apply) at the sizes and thread budgets of the ohtaka-cpu profile, f64 and F order only. `eig` (the non-symmetric eigensolver) and `upgrade_factor` are not declared: the harness implements neither for any row. Runs recorded before this declaration widened (colmat-benchmark#129) measured gemm, lu, cholesky and qr_factor only; their pages stay what they measured and are not a coverage claim for the other families."
    - "`full_piv_lu` is declared on square shapes only, because its vendor route is LAPACK `?getc2`, which is square only (#133); the faer rows would take a rectangular shape, but a rectangular cell would have no vendor opponent. `?getc2` is also the unblocked, level-2 routine against colmat's blocked `full_piv_lu`, with no vendor-blocked alternative, so the vendor row does not scale with the thread budget the way the faer row does: that row measures the route, not a like-for-like algorithm (`fbench info` prints it as `route_difference.full_piv_lu`)."
    - "Rectangular shapes (the tall and wide populations) carry only the families defined on them: `lu`, `qr_factor`, `qr`, `svd_values`, `svd_thin`, and `householder_apply` on the tall shape. `cholesky`, `solve`, `triangular_solve`, `eigh` and `full_piv_lu` are square-only here and appear in the square populations alone; `householder_apply` is not declared on the wide shape, as in the zen5 suites. The `cholesky`/`eigh`/`solve`/`triangular_solve` sentence above describes the harness's gate; on this profile the declaration never reaches it."
    - "`householder_apply`, `triangular_solve` and `full_piv_lu` vendor routes (`?larfb`/`?ormqr`, `?trsm`, `?getc2`) take the operands the faer rows built: reflectors, `T` (`?larft`) and the triangular factor are prepared outside timing, so the vendor row times the apply or solve alone, as the faer rows do (`docs/reliable-measurement.md`)."
    - "Fixture and check cost at 8192 is outside timing but inside the allocation: `eigh`, `svd_thin` and `svd_values` build their input and, after the last timed call, check the result with an O(n^3) reconstruction at the cell's own size, and the vendor `full_piv_lu` route `?getc2` is unblocked (level-2), so its per-call time at 8192 is far above the blocked routes'. None of this is in a timed sample, but at 8192 one such family can exceed a 30-minute `i8cpu` allocation by itself, so the 8192 grid of the wider family set is recorded in more and smaller slices (one family per slice where needed) than the four-family grid was; a slice that does not fit is a partial run, not a measured zero."
    - "The boundary population is 4095 and 4097, the zen5 suites' 255/257 and 511/513 block-boundary diagnostic moved up to this suite's 4096 tier. The 8191/8193 pair is not declared: at 8192 the cost of the full family set is already the binding limit of a debug-queue slice."
    - "Residual-check coverage narrowed: the verification census (`verify`) covers the 4096-class cells only (4096, 4095/4097, 8192x512, 512x8192), at every thread budget; no 8192 square is in it. A timed process also checks the result of its last timed call at the cell's own size (the harness's `timing::measure` ends in the cell's check), so a wrong 8192 result fails its row; that check is not part of the census and records no residual. Where this page says every timed cell matches a verification census, read it with this limit."

# One entry per engine name the harness emits. A result page explains every
# column from this, so a reader needs no context beyond the page.
engines_doc:
  faer-fork:
    provider: faer-fork
    summary: >-
      The measured library: the tensor4all fork (`colmat`, `[lib] name = "colmat"`)
      at the checkout the harness linked by path. This is the row the campaign
      exists for; the fork's three perf experiments and the two correctness
      changes land here.
    identity: >-
      the fork revision in this run's manifest (`library.commit`), pinned by
      `pins/t4a-faer.rev`
    caveat: >-
      The fork crate is `colmat` (`[lib] name = "colmat"`); the upstream baseline is
      `faer` (`faer_upstream = { package = "faer" }`). They are distinct Rust crate
      identities, but their `Mat`, `Par` and trait types are not interchangeable:
      every adapter is written per arm, and shared transitive dependencies can unify
      Cargo features, so both arms declare equivalent feature sets and the resolved
      lock is recorded.
      measured at 93da6217, colmat-rs main at the 2026-11-17 head: no tag names that
      revision, and the published crates.io colmat 0.34.0 was cut from e1c83482.
      The 2026-11-17 zen5-cpu recordings were taken at this revision.
  faer-upstream:
    provider: faer-upstream
    summary: >-
      Upstream `faer` at the tag the fork is based on, in the same binary as the
      fork row. The baseline that says whether a fork change moved the number.
    identity: >-
      the upstream revision in this run's manifest (`upstream.commit`), pinned by
      `pins/upstream-faer.rev`
    caveat: >-
      Same crate-name and feature-unification caveat as `faer-fork`. A change to
      upstream at a fixed fork revision produces a different page rather than
      overwriting one.
  lapack-openblas:
    provider: openblas
    summary: >-
      CBLAS `?gemm` plus LAPACK drivers linked against OpenBLAS: vendor calls and
      their marshalling, vendor-owned threading. The vendor's own thread budget
      is set by the harness before the row and read back, and the vendor identity
      and the dispatched kernel are recorded in the manifest.
    identity: the OpenBLAS build recorded in this run's manifest (`providers[openblas]`)
    caveat: >-
      LAPACK and BLAS own their threading, so this row's thread budget is the
      vendor's, not the harness pool's. Where a family has no LAPACK route the
      row is absent and the CSV says the case was skipped for it.
  lapack-mkl:
    provider: mkl
    summary: >-
      The same calls against Intel oneAPI MKL, linked from the installation
      `MKLROOT` names. One binary links one vendor library, so this row is
      measured by its own build of the harness and recorded as its own run; no
      page carries two vendor arms. The LP64 interface layer and the threading
      layer are pinned by the harness before the first MKL call, because MKL
      otherwise lets the environment choose them and the interface layer is an ABI.
    identity: the MKL build recorded in this run's manifest (`providers[mkl]`)
    caveat: >-
      MKL reports no dispatched-kernel name and no processor count, so its
      manifest records neither rather than inferring them. Its threading is
      vendor-owned, as for OpenBLAS.


# The verification census (`fbench verify`) recomputes each case's reference with a cache-blocked
# product (`fbench/src/shared.rs` `mm`), which is parallel on the rayon pool from the harness revision of this
# suite on. A single-threaded product at 8192 and above was minutes to hours per case, so the census is
# narrowed to the 4096-class cells of every population at every thread budget: 4096, the 4095/4097
# boundary and the 8192x512/512x8192 rectangles (whose reference product is the cost of a 4096 cell or less). A timed process still checks its
# last call at the cell's own size; see `known_blind_spots`. A stated limit of this suite, not an inferred one.
verify:
  n: ["4096", "4096x4096x4096", "4095", "4097", "8192x512", "512x8192"]

runs:
  - threads: [16, 32, 64, 128]
    # The CPUs of each thread row are the profile's own `thread_rows`: 16T is NUMA node 0, 32T
    # nodes 0-1, 64T socket 0, 128T the whole node (no observer CPU is left).
    cpu_sets: {ohtaka-cpu: ["0-15", "0-31", "0-63", "0-127"]}
    dtypes: [f64]
    # F (column-major) only: the issue fixes the order for this profile.
    order: [f]
    # One vendor arm per run (AGENTS.md). Both arms are declared; the ohtaka large tiers are recorded
    # with the MKL arm (oneapi_mkl/2025.2.0 module, built on the login node), small/c64 with OpenBLAS.
    engines: [faer-fork, lapack-openblas, lapack-mkl]
    populations:
      - regime: gemm-ohtaka
        groups: [gemm]
        n: ["4096x4096x4096", "8192x8192x8192"]
        batch: [1]
      # The regime names `gemm-ohtaka` and `linalg-ohtaka` are kept from the four-family grid so the
      # cells already recorded join the new ones; `linalg-ohtaka` now names all twelve families.
      - regime: linalg-ohtaka
        groups: [factor, square, decompose, householder]
        n: ["4096", "8192"]
        batch: [1]
      # Shapes follow the zen5 suites' choice, scaled to this tier: their `linalg-tall`/`linalg-wide`
      # (16:1, 4096x256 and 256x4096) become 8192x512/512x8192, and their `linalg-boundary` block-boundary
      # pairs (255/257, 511/513) become 4095/4097. A rectangular population names no square-only family.
      - regime: linalg-ohtaka-tall
        groups: [factor, decompose, householder]
        n: ["8192x512"]
        batch: [1]
      - regime: linalg-ohtaka-wide
        groups: [factor, decompose]
        n: ["512x8192"]
        batch: [1]
      - regime: linalg-ohtaka-boundary
        groups: [factor, square, decompose]
        n: ["4095", "4097"]
        batch: [1]
