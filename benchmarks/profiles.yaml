# Hardware profiles. A profile is a machine (or a well-defined container on one)
# whose cells are only comparable with each other. Adding one is a deliberate
# act: an unknown profile in a run manifest is a schema error, not a warning.
schema_version: 1
profiles:
  - name: zen5-cpu
    description: >-
      AMD Ryzen AI 9 HX 470 (Zen5 mobile APU), 12 physical / 24 logical cores.
      Heterogeneous L3: CPUs 0-3 share 16 MiB, CPUs 4-11 share 8 MiB, so a
      thread set must be stated together with the domain it sits in. SMT
      siblings of CPUs 4-11 are 16-23; the idle gate checks them too, because a
      busy sibling contends with the physical core being measured.
    cpu: AMD Ryzen AI 9 HX 470
    logical_cpus: 24
    l3: "0-3: 16 MiB shared; 4-11: 8 MiB shared"
    # SMT siblings of CPU n are n+12 (`lscpu -e`); the same declaration the toolkit's shared
    # `zen5-cpu.yaml` carries. Without it the recorder has no SMT claim to check this host
    # against (`benchmarks/scripts/idle_cpus.py` records 16-23 as the siblings of 4-11).
    smt: {threads_per_core: 2, sibling_offset: 12}
  # The measurement host (tensor4all-meta#76 D5), resolved against
  # `campaign_toolkit/profiles/zen2-cpu.yaml`. Every suite lists it as optional: it is
  # measured when the stack's versions move, not on the weekly schedule.
  # That declaration is the machine with SMT on: 128 logical cores, sibling n+64. The
  # host as it is measured today has SMT off, so it is a second profile, not a second
  # reading of the first (faer-benchmark#55): one name must not point at two machines.
  - zen2-cpu
  - name: zen2-64-smt-off
    role: measurement
    description: >-
      The measurement host with SMT disabled in the BIOS: AMD EPYC 7702P (Zen 2),
      1 socket, 8 CCDs of 2 CCXs of 4 cores, 64 physical / 64 logical cores, 16 L3
      domains of 16 MiB, one per 4-core CCX. Measured on the host, not assumed:
      `lscpu` reports 64 CPU(s), 1 thread per core, 1 socket, 256 MiB L3 and 1 NUMA
      node, `online` is 0-63, `smt/active` is 0 with `smt/control` `notsupported`,
      every CPU's `thread_siblings_list` is itself, and
      `cache/index3/shared_cpu_list` is 4k-4k+3 for all 64 CPUs. `zen2-cpu` is the
      same server with SMT on; `scripts/record_run.py` refuses a profile whose
      declared logical count or SMT state disagrees with the host.
    cpu: AMD EPYC 7702P
    logical_cpus: 64
    l3: "16 MiB shared per 4-core CCX, 16 CCXs (CPUs 4k-4k+3)"
    # One hardware thread per core: CPU n's sibling is n itself.
    smt: {threads_per_core: 1, sibling_offset: 64}
    record_numa: true
    power:
      cpufreq_boost: "0"
      governor: performance
    # One logical CPU per physical core is measured, so a row is its CPU set. The 4T row is
    # one CCX and its own L3 domain; the 8T row is one CCD, two CCXs, so it spans two domains
    # (the recorder warns and the idle gate watches both). There is no 64T row: every core
    # would be measured, no CPU would be left for the observing side, and the recorder's own
    # affinity check refuses a run from a process that may sit inside a measured domain.
    thread_rows:
      - {threads: 1, measured: "0", observer: "4-63"}
      - {threads: 4, measured: "0-3", observer: "4-63"}
      - {threads: 8, measured: "0-7", observer: "8-63"}
  # ISSP ohtaka FAT node (c18fat1-8, partitions i1fat/B2fat/L2fat/F2fat: one whole node of 112
  # cores and 3 TB), tensor4all/colmat-benchmark#101. Never mixed with ohtaka-cpu (the 128-core
  # EPYC F1cpu node) or with zen5-cpu: a different machine, a different core count, cache layout
  # and memory class, so its cells are only comparable with each other.
  # The layout is as MEASURED on c18fat8 (2026-11-21, i1fat job 3222793), not as assumed: `lscpu`
  # reports 112 CPU(s), 1 thread per core, 4 sockets of 28 cores, 4 NUMA nodes, `smt/active` 0 with
  # `smt/control` on, 39424 KiB of L3 per socket, and 774 GB of memory per node (3168122680 kB
  # total). The CPUs are numbered ACROSS the sockets, not within them: NUMA node k is the CPUs
  # that are k mod 4 (node 0 = 0,4,...,108) and `cache/index3/shared_cpu_list` is the 28 CPUs of one
  # node for all four, so a thread row has to name its CPUs one by one - `0-15` would straddle all
  # four nodes. Turbo (4.0 GHz) and the governor are exposed by cpufreq here, so the recorder
  # records the power state instead of this profile declaring it (contrast ohtaka-cpu, which
  # exposes no cpufreq and must say it does not).
  - name: ohtaka-fat
    role: measurement
    description: >-
      4x Intel Xeon Platinum 8280 (Cascade Lake), 112 physical / 112 logical cores (SMT off),
      4 NUMA nodes of 28 cores of 774 GB each, 39424 KiB of L3 per socket. Rows fill one node
      before the next: 16T is the first 16 cores of node 0, 32T all of node 0 and 4 cores of node
      1, 64T nodes 0-1 and 8 cores of node 2, 112T the whole machine. The 112T row measures every
      core, so no CPU is left for the observing side: it is declared with no observer and the run
      is recorded os-shared (shared with the operating system, Slurm and the recorder).
    cpu: Intel Xeon Platinum 8280
    logical_cpus: 112
    l3: "39424 KiB per socket: 4 domains of 28 CPUs, one per NUMA node, node k = CPUs = k mod 4"
    # One hardware thread per core: CPU n's sibling is n itself.
    smt: {threads_per_core: 1, sibling_offset: 112}
    record_numa: true
    # The measured CPUs are named explicitly because the numbering is interleaved across the four
    # sockets. The observing side sits in NUMA node 3 (CPUs 3,7,...,111), which no row below 112T
    # measures: one L3 domain of its own, so the recorder and the guard never run in a domain the
    # cells time in. The 112T row has no such CPU and declares none.
    thread_rows:
      - {threads: 16, measured: "0,4,8,12,16,20,24,28,32,36,40,44,48,52,56,60",
         observer: "3,7,11,15,19,23,27,31,35,39,43,47,51,55,59,63,67,71,75,79,83,87,91,95,99,103,107,111"}
      - {threads: 32, measured: "0,4,8,12,16,20,24,28,32,36,40,44,48,52,56,60,64,68,72,76,80,84,88,92,96,100,104,108,1,5,9,13",
         observer: "3,7,11,15,19,23,27,31,35,39,43,47,51,55,59,63,67,71,75,79,83,87,91,95,99,103,107,111"}
      - {threads: 64, measured: "0,4,8,12,16,20,24,28,32,36,40,44,48,52,56,60,64,68,72,76,80,84,88,92,96,100,104,108,1,5,9,13,17,21,25,29,33,37,41,45,49,53,57,61,65,69,73,77,81,85,89,93,97,101,105,109,2,6,10,14,18,22,26,30",
         observer: "3,7,11,15,19,23,27,31,35,39,43,47,51,55,59,63,67,71,75,79,83,87,91,95,99,103,107,111"}
      - {threads: 112, measured: "0-111", observer: ""}
