    - 32x32x32
    - 64x64x64
    - 96x96x96
    batch:
    - 1
  - regime: gemm-mid
    families:
    - gemm
    n:
    - 128x128x128
    - 192x192x192
    - 256x256x256
    - 384x384x384
    - 512x512x512
    - 768x768x768
    batch:
    - 1
  - regime: gemm-tall
    families:
    - gemm
    n:
    - 4096x64x64
    - 16x4096x240
    - 4096x16x240
    batch:
    - 1
  - regime: gemm-wide
    families:
    - gemm
    n:
    - 64x64x4096
    batch:
    - 1
  - regime: linalg-small
    families:
    - lu
    - full_piv_lu
    - cholesky
    - triangular_solve
    - solve
    - qr_factor
    - qr
    - svd_values
    - svd_thin
    - eigh
    - eig
    - upgrade_factor
    - householder_apply
